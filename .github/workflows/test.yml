name: Test
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      digests:
        required: true
        type: string
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_PASSWORD:
        required: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # v6

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          set -euo pipefail

          args=(
            test
            --image "${{ inputs.image }}"
            --repository "${{ vars.repository || 'islandora' }}"
            --mode fallback
            --tag "${{ github.ref_name }}"
            --pull
          )

          for digest in ${{ inputs.digests }}; do
            digest="${digest#-Pisle.}"
            image="${digest%%.digest=*}"
            ref="${digest#*.digest=}"
            env_name="$(printf '%s' "$image" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')"
            args+=(--image-ref "${env_name}=${ref}")
          done

          go run ./cmd/buildkit "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ inputs.image }} Test Logs
          path: build/test-logs/**
