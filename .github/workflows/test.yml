name: Test
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      digests:
        required: true
        type: string
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_PASSWORD:
        required: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          set -euo pipefail

          args=(
            test
            --image "${{ inputs.image }}"
            --repository "${{ vars.repository || 'islandora' }}"
            --mode fallback
            --tag "${{ github.ref_name }}"
            --pull
          )

          for digest in ${{ inputs.digests }}; do
            digest="${digest#-Pisle.}"
            image="${digest%%.digest=*}"
            ref="${digest#*.digest=}"
            env_name="$(printf '%s' "$image" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')"
            args+=(--image-ref "${env_name}=${ref}")
          done

          go run ./cmd/buildkit "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ inputs.image }} Test Logs
          path: build/test-logs/**
