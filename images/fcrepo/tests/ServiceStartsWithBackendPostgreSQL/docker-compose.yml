# file: docker-compose.yml
#
# Tests that the service starts with the selected database backend.
#
# `base/rootfs/etc/cont-init.d/00-container-environment-00-init.sh`
x-common: &common
  restart: "no"

name: fcrepo-servicestartswithbackendpostgresql
services:
  activemq:
    <<: *common
    image: ${ACTIVEMQ:-islandora/activemq:local}
  postgresql:
    image: ${POSTGRESQL:-islandora/postgresql:local}
  fcrepo:
    environment:
      FCREPO_PERSISTENCE_TYPE: postgresql
    volumes:
      - ./test.sh:/test.sh # Test to run.
    command:
      - /test.sh # Run test and exit.
    image: ${FCREPO:-islandora/fcrepo:local}
    depends_on:
      - activemq
      - postgresql
